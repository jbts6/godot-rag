name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest -q

      - name: Check build script syntax
        run: bash -n build.sh

  publish:
    name: Build and publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publisher (OIDC)
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Install pandoc
        run: sudo apt-get install -y pandoc

      - name: Fetch Scene Manager wiki
        run: |
          git clone --depth 1 https://github.com/glass-brick/Scene-Manager.wiki.git .cache/addon-wikis/scene_manager
          cp -r .cache/addon-wikis/scene_manager addons/scene_manager/docs_wiki
          rm -rf addons/scene_manager/docs_wiki/.git

      - name: Build docs and database
        run: |
          PYTHONPATH=rst2md uv run python3 rst2md/rst2md_batch.py -i godot-docs -o godot_rag/docs-md
          mkdir -p godot_rag/rag
          PYTHONPATH=rst2md uv run python3 -m rag.cli build --docs godot_rag/docs-md --db godot_rag/rag/godot_docs.sqlite --addons addons

      - name: Assemble package
        run: |
          touch godot_rag/__init__.py
          cp rst2md/rag/*.py godot_rag/rag/
          cp -r rst2md/rag/addon_configs godot_rag/rag/
          python3 -c "
          import glob, sys
          for f in glob.glob(sys.argv[1] + '/*.py'):
              t = open(f).read().replace('from rag.', 'from godot_rag.rag.')
              open(f, 'w').write(t)
          for f in glob.glob(sys.argv[1] + '/addon_configs/*.py'):
              t = open(f).read().replace('from rag.', 'from godot_rag.rag.')
              open(f, 'w').write(t)
          " godot_rag/rag

      - name: Merge README for PyPI
        run: python3 scripts/merge_readme.py

      - name: Build wheel
        run: uv build --wheel

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
