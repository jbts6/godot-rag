[project]
name = "godot-rag"
version = "4.7.0.post9"
description = "Hybrid RAG search for Godot documentation"
readme = "README_PYPI.md"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
godot-rag = "godot_rag.rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["godot_rag"]
exclude = ["godot_rag/docs-md/**"]

[tool.hatch.build]
ignore-vcs = true

[tool.pytest.ini_options]
pythonpath = ["rst2md"]
testpaths = ["rst2md/tests"]
