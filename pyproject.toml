[project]
name = "godot-rag"
version = "4.7.0"
description = "Hybrid RAG search for Godot documentation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
godot-rag = "godot_rag.rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["godot_rag"]
exclude = ["godot_rag/docs-md/**"]

[tool.hatch.build]
ignore-vcs = true
