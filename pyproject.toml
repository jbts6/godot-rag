[project]
name = "godot-rag"
version = "4.7.0.post11"
description = "Hybrid RAG search for Godot documentation"
readme = "README_PYPI.md"
requires-python = ">=3.10"
dependencies = [
    "sqlite-vec>=0.1.9",
    "model2vec>=0.8.2",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
godot-rag = "rag.cli:main"
godot-rag-build = "godot_rag_build.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rst2md/rag", "godot_rag", "godot_rag_build"]
exclude = ["godot_rag/docs-md/**"]

[tool.hatch.build]
ignore-vcs = true

[tool.pytest.ini_options]
pythonpath = ["rst2md"]
testpaths = ["rst2md/tests"]
